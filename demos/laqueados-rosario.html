body{margin:0;background:#F3F3F1;color:#161616;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.sum{list-style:none}.sum::-webkit-details-marker{display:none}
.chev{transition:transform 200ms cubic-bezier(0.23,1,0.32,1);flex:none}details[open]>.sum .chev{transform:rotate(180deg)}

<h2 id="med-t" style="margin: 0; font-size: clamp(30px, 4vw, 50px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; max-width: 20ch">De tu idea al mueble instalado, en 60 días.</h2>
<ol style="list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<li style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; font-weight: 700; color: #2F6B6E; line-height: 1">01</span>
<h3 style="margin: 0; font-size: 18px; font-weight: 700">Presupuesto</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A5650">Armá tu ambiente en 3D o mandanos medidas aproximadas. Si querés, te asesora nuestra diseñadora en tu casa (con un costo que después se descuenta).</p>
</li>
<li style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; font-weight: 700; color: #2F6B6E; line-height: 1">02</span>
<h3 style="margin: 0; font-size: 18px; font-weight: 700">Medimos sin cargo</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A5650">Con el presupuesto aprobado, vamos y tomamos las medidas exactas.</p>
</li>
<li style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; font-weight: 700; color: #2F6B6E; line-height: 1">03</span>
<h3 style="margin: 0; font-size: 18px; font-weight: 700">Fabricamos</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A5650">Cortamos, armamos y laqueamos en nuestro taller. Entrega en 60 días.</p>
</li>
<li style="background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; font-weight: 700; color: #2F6B6E; line-height: 1">04</span>
<h3 style="margin: 0; font-size: 18px; font-weight: 700">Instalamos</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A5650">Llevamos el mueble y lo dejamos instalado y nivelado.</p>
</li>
</ol>
